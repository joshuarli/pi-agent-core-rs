[package]
name = "pi-agent-tui"
version = "0.1.0"
edition = "2021"
description = "Minimal interactive terminal host for pi-agent-core"
license = "MIT OR Apache-2.0"

[[bin]]
name = "pi-agent"
path = "src/main.rs"

[[bin]]
name = "pi-agent-headless"
path = "src/bin/pi-agent-headless.rs"

[lib]
path = "src/lib.rs"

[features]
# Compiles the real-binary PTY regression harness and its local OpenRouter endpoint override.
pty-harness = ["pi-agent-core/provider-openrouter-test-support"]

[dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
pi-agent-core = { path = "../pi-agent-core", features = [
    "provider-commandcode",
    "provider-openrouter",
    "provider-local",
] }
smol = { workspace = true }

[dev-dependencies]
ptytest = { path = "../../../ptytest" }

[[test]]
name = "pty_streaming"
path = "tests/pty_streaming.rs"
required-features = ["pty-harness"]
