[package]
name = "pi-agent-tui"
version = "0.1.0"
edition = "2021"
description = "Minimal interactive terminal host for pi-agent-core"
license = "MIT OR Apache-2.0"

[[bin]]
name = "pi-agent"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
pi-agent-core = { path = "../pi-agent-core", features = ["provider-commandcode", "provider-openrouter"] }
smol = { workspace = true }
