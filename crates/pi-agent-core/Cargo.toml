[package]
name = "pi-agent-core"
version = "0.1.0"
edition = "2021"
description = "Nightly Rust state-machine kernel for the Pi agent runtime"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
default = []
parity-runner = ["dep:smol"]
provider-commandcode = ["dep:ureq"]
provider-openrouter = ["dep:ureq"]
provider-local = ["dep:ureq"]
eval-runner = ["dep:smol", "provider-commandcode", "provider-openrouter"]
trace = ["dep:pi-agent-trace"]

[dependencies]
pi-agent-protocol = { path = "../pi-agent-protocol" }
pi-agent-trace = { path = "../pi-agent-trace", optional = true }
smol = { workspace = true, optional = true }
ureq = {
    version = "=3.4.0",
    default-features = false,
    features = ["rustls"],
    optional = true,
}

[dev-dependencies]
smol = { workspace = true }
# Quality-only allocation profiling. This is the same `AllocProfiler::system()`
# global-allocator pattern used by the local `e` project; it is never linked
# into the core library or production adapters.
rustybench = "=0.1.0"

[[bin]]
name = "pi-agent-parity"
path = "src/bin/pi-agent-parity.rs"
required-features = ["parity-runner"]

[[bin]]
name = "pi-agent-eval"
path = "src/bin/pi-agent-eval.rs"
required-features = ["eval-runner"]

[[bench]]
name = "quality_memory"
harness = false
