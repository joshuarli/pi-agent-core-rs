[package]
name = "pi-agent-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Dependency-free state-machine scaffold for the Pi agent runtime"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
default = []
parity-runner = ["dep:smol"]

[dependencies]
jsonschema = { workspace = true }
pi-agent-protocol = { path = "../pi-agent-protocol" }
serde_json = { workspace = true }
smol = { workspace = true, optional = true }

[dev-dependencies]
smol = { workspace = true }

[[bin]]
name = "pi-agent-parity"
path = "src/bin/pi-agent-parity.rs"
required-features = ["parity-runner"]
